<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Catálogo de Deportes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="min-vh-100 d-flex flex-column text-dark" style="background-color: #f8fafc;">

    {% if request.user.is_authenticated %}
        <nav class="navbar bg-white border-bottom py-3">
            <div class="container">
                <a class="navbar-brand fw-semibold text-dark mb-0" href="{% url 'catalogo' %}">
                    Deportes <span class="text-primary">Catálogo</span>
                </a>
                <div class="d-flex align-items-center gap-3">
                    <span class="small text-secondary">
                        Sesión: <strong class="text-dark">{{ request.user.username }}</strong>
                    </span>
                    <a href="{% url 'cerrar_sesion' %}" class="btn btn-outline-secondary btn-sm px-3">
                        Cerrar sesión
                    </a>
                </div>
            </div>
        </nav>
    {% endif %}

    <main class="container my-5 flex-grow-1">
        {% if messages %}
            {% for mensaje in messages %}
                <div class="alert alert-light border shadow-sm py-2 px-3 small rounded-3 mb-4" role="alert">
                    {{ mensaje }}
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center">
            <span class="small text-secondary">
                Creado por <strong class="text-dark">Cristóbal Rey</strong> &middot; 2026
            </span>
        </div>
    </footer>

</body>
</html>
