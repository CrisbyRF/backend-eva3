<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #f8fafc;">

    <div class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-9 col-md-6 col-lg-4">
                <main class="card bg-white border shadow-sm rounded-4">
                    <div class="card-body p-4 p-sm-5">
                        <div class="mb-4">
                            <h1 class="h4 fw-semibold text-dark mb-1">Iniciar sesión</h1>
                            <p class="small text-secondary mb-0">Ingresa tus credenciales para continuar.</p>
                        </div>

                        {% if messages %}
                            {% for mensaje in messages %}
                                <div class="alert alert-danger py-2 small rounded-3" role="alert">
                                    {{ mensaje }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" action="">
                            {% csrf_token %}
                            <input type="hidden" name="siguiente" value="{{ request.GET.next }}">

                            <div class="mb-3">
                                <label for="usuario" class="form-label small fw-medium text-secondary">Usuario</label>
                                <input
                                    type="text"
                                    class="form-control py-2"
                                    id="usuario"
                                    name="usuario"
                                    placeholder="Nombre de usuario"
                                    required
                                    autocomplete="username"
                                >
                            </div>

                            <div class="mb-4">
                                <label for="contrasena" class="form-label small fw-medium text-secondary">Contraseña</label>
                                <input
                                    type="password"
                                    class="form-control py-2"
                                    id="contrasena"
                                    name="contrasena"
                                    placeholder="••••••••"
                                    required
                                    autocomplete="current-password"
                                >
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
                                Ingresar
                            </button>
                        </form>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <footer class="py-3 text-center">
        <span class="small text-secondary">
            Creado por <strong class="text-dark">Cristóbal Rey</strong> &middot; 2026
        </span>
    </footer>

</body>
</html>
